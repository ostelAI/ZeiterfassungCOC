    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
    position:fixed;
    inset:0;
    width:100%;
    padding-top:env(safe-area-inset-top);
  }
  body::before{
    content:"";
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    opacity:0.09;
    mix-blend-mode:soft-light;
  }
  #app{ max-width:520px; margin:0 auto; height:100%; display:flex; flex-direction:column; position:relative; z-index:1; }
  header.top{
    padding:20px 18px 14px;
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:1px solid var(--border);
    position:relative;
    background:linear-gradient(180deg, rgba(226,54,54,0.06), transparent 70%);
  }
  header.top::after{
    content:""; position:absolute; left:0; right:0; bottom:-4px; height:4px;
    background:repeating-linear-gradient(-45deg, var(--accent) 0 10px, #1a1414 10px 20px);
    opacity:0.85;
  }
  header.top h1{
    font-family:'Big Shoulders Display', sans-serif; font-weight:800; font-size:29px;
    letter-spacing:1px; margin:0; text-transform:uppercase; color:var(--text);
    text-shadow:0 2px 0 rgba(0,0,0,0.5);
  }
  header.top h1 span{ color:var(--accent); }
  header.top .ver{
    font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--bg); background:var(--accent);
    padding:3px 7px; border-radius:5px; font-weight:700; letter-spacing:0.5px;
  }
  .poweredby{
    display:flex; align-items:center; justify-content:center; gap:6px;
    padding:7px 0 4px; font-size:10px; color:var(--text-muted); letter-spacing:0.6px; text-transform:uppercase;
  }
  .poweredby img{ width:18px; height:18px; border-radius:4px; opacity:0.9; }
  #main{ flex:1; padding:16px 16px 90px; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
  .card{
    background:
      repeating-linear-gradient(115deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 5px),
      linear-gradient(155deg, var(--panel), #151011 85%);
    border:1.5px solid var(--accent-dim);
    border-radius:var(--radius); padding:16px; margin-bottom:14px;
    box-shadow:0 4px 14px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.03);
  }
  .card h2{
    font-family:'Big Shoulders Display', sans-serif; font-weight:700; font-size:15px;
    letter-spacing:1.4px; text-transform:uppercase; color:var(--text-muted); margin:0 0 12px;
  }
  .card h2::before{ content:"// "; color:var(--accent-dim); }
  .row{ display:flex; align-items:center; justify-content:space-between; }
  .navrow{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .navrow .navbtn{
    background:var(--panel2); border:1px solid var(--border); color:var(--text);

    width:38px;height:38px; border-radius:10px; font-size:18px;
    display:flex;align-items:center;justify-content:center;
  }
  .navrow .navlabel{ font-family:'JetBrains Mono', monospace; font-size:17px; text-align:center; color:var(--text); }
  .navrow .navlabel small{ display:block; color:var(--text-muted); font-size:13px; margin-top:2px; }

  /* Stempeluhr */
  .clockwrap{ display:flex; flex-direction:column; align-items:center; padding:8px 0 4px; }
  .backup-hint{
    background:rgba(232,178,61,0.12); border:1px solid #E8B23D; color:#E8B23D;
    border-radius:10px; padding:10px 14px; margin-bottom:14px; font-size:12px; text-align:center; cursor:pointer;
  }
  .jobselect{
    display:flex; align-items:center; gap:9px; background:var(--panel2); border:1px solid var(--accent-dim);
    border-radius:24px; padding:11px 22px; font-size:15px; font-weight:700; color:var(--text);
    margin-bottom:18px; cursor:pointer; letter-spacing:0.3px;
    box-shadow:0 3px 10px rgba(0,0,0,0.35);
  }
  .jobselect .jdot{ width:9px; height:9px; border-radius:50%; background:var(--accent); flex-shrink:0; }
  .gauge{ width:100%; position:relative; }

  .gauge-row{ display:flex; align-items:center; gap:6px; width:100%; position:relative; z-index:1; }
  .gauge-side{ text-align:center; min-width:46px; flex-shrink:0; }
  .gauge-side .gs-lbl{ font-family:'Rajdhani',sans-serif; font-size:11px; font-weight:600; letter-spacing:2px; text-transform:uppercase; color:var(--text-muted); }
  .gauge-side .gs-time{ font-family:'Orbitron',sans-serif; font-size:14px; font-weight:600; color:var(--text); margin-top:4px; }
  .gauge-mid{ flex:1; position:relative; }
  .gauge-svg{ width:100%; height:auto; display:block; overflow:visible; }
  .gauge-track-arc{ fill:none; stroke:#4a4040; stroke-width:16; stroke-linecap:round; }
  .gauge-fill-arc{
    fill:none; stroke:var(--accent); stroke-width:16; stroke-linecap:round;
    animation: gaugeGlowPulse 1.15s ease-in-out infinite;
  }
  @keyframes gaugeGlowPulse{
    0%, 100%{ filter:drop-shadow(0 0 3px rgba(255,90,78,0.5)) drop-shadow(0 0 1px rgba(255,90,78,0.6)); stroke:var(--accent); }
    50%{ filter:drop-shadow(0 0 20px rgba(255,90,78,1)) drop-shadow(0 0 8px rgba(255,255,255,0.5)); stroke:#FF5A4E; }
  }
  @media (prefers-reduced-motion: reduce){ .gauge-fill-arc{ animation:none; filter:drop-shadow(0 0 8px rgba(255,90,78,0.8)); } }
  .gauge-boost-arc{
    fill:none; stroke:#E8B23D; stroke-width:16; stroke-linecap:round;
    animation: gaugeGlowPulseBoost 0.85s ease-in-out infinite;
  }
  @keyframes gaugeGlowPulseBoost{
    0%, 100%{ filter:drop-shadow(0 0 4px rgba(232,178,61,0.6)); }
    50%{ filter:drop-shadow(0 0 22px rgba(255,214,120,1)); }
  }
  @media (prefers-reduced-motion: reduce){ .gauge-boost-arc{ animation:none; filter:drop-shadow(0 0 8px rgba(232,178,61,0.9)); } }
  .gauge-tick{ stroke:var(--text); stroke-width:2.5; }
  .gauge-minor-tick{ stroke:var(--text-muted); stroke-width:1.5; opacity:0.7; }
  .gauge-needle{ fill:var(--text); filter:drop-shadow(0 0 5px rgba(255,255,255,0.35)); }
  .gauge-needle-tip{ fill:#FF5A4E; filter:drop-shadow(0 0 6px rgba(255,90,78,0.9)); }
  .gauge-hub-outer{ fill:#2a2222; stroke:var(--border); stroke-width:1.5; }
  .gauge-hub-inner{ fill:#FF5A4E; filter:drop-shadow(0 0 4px rgba(255,90,78,0.9)); }
  .gauge-label{ font-family:'Orbitron',sans-serif; font-weight:600; font-size:10px; fill:var(--text-muted); }
  .gauge-label-soll{ fill:var(--text); font-weight:800; }
  .gauge-center{
    position:absolute; left:50%; top:90%; transform:translateX(-50%);
    text-align:center; width:78%; pointer-events:none;
  }
  .gauge-center .gc-lbl{ font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--text-muted); }
  .gauge-center .gc-val{ font-family:'Orbitron',sans-serif; font-size:19px; font-weight:800; color:var(--text); margin-top:2px; letter-spacing:0.5px; }
  .gauge-status{ text-align:center; margin-top:6px; font-size:12px; color:var(--text-muted); letter-spacing:0.3px; min-height:16px; }
  .gauge-status .boost-tag{ color:#E8B23D; font-weight:700; }
  .punchrow{ display:flex; gap:10px; width:100%; margin-top:18px; }
  .punchbtn{
    flex:1; padding:15px; border-radius:12px; border:none;
    font-family:'Big Shoulders Display', sans-serif; font-weight:700; font-size:17px;
    letter-spacing:1px; text-transform:uppercase; background:var(--accent); color:#fff; cursor:pointer;
    box-shadow:0 3px 0 var(--accent-dim), 0 4px 10px rgba(0,0,0,0.4);
  }
  .punchbtn.secondary{ background:var(--panel2); color:var(--text); border:1px solid var(--border); box-shadow:0 3px 0 var(--border), 0 4px 10px rgba(0,0,0,0.3); }
  .punchbtn.pressed{ animation:stamp .25s ease; }
  @keyframes stamp{ 0%{transform:scale(1) translateY(0);} 40%{transform:scale(0.93) translateY(2px);} 100%{transform:scale(1) translateY(0);} }


  .bigstat{ display:flex; align-items:flex-end; justify-content:space-between; gap:10px; }
  .bigstat .num{ font-family:'JetBrains Mono', monospace; font-size:32px; font-weight:700; line-height:1; }
  .bigstat .num.pos{ color:var(--positive); }
  .bigstat .num.warn{ color:var(--accent); }
  .bigstat .lbl{ font-size:13px; color:var(--text-muted); margin-top:4px; }
  .statgrid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:10px; }
  .statgrid.three{ grid-template-columns:1fr 1fr 1fr; }
  .statgrid .box{ background:var(--panel2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; }
  .statgrid .box .v{ font-family:'JetBrains Mono', monospace; font-size:18px; font-weight:600; }
  .statgrid .box .v.pos{ color:var(--positive); }
  .statgrid .box .v.warn{ color:var(--accent); }
  .statgrid .box .k{ font-size:12px; color:var(--text-muted); margin-top:2px; }
  .feierabend{
    margin-top:12px; background:var(--panel2); border:1px solid var(--border); border-radius:10px;
    padding:12px; text-align:center;
  }
  .feierabend .fa-extra{ display:flex; justify-content:space-between; gap:4px; flex-wrap:wrap; }
  .feierabend .fa-mini{ display:flex; flex-direction:column; align-items:center; flex:1; min-width:70px; max-width:47%; }
  .feierabend .fa-mini-v{ font-family:'JetBrains Mono', monospace; font-size:14px; font-weight:600; }
  .feierabend .fa-mini-v.pos{ color:var(--positive); }
  .feierabend .fa-mini-v.warn{ color:var(--accent); }
  .feierabend .fa-mini-k{ font-size:9.5px; color:var(--text-muted); margin-top:2px; text-transform:uppercase; letter-spacing:0.2px; word-break:break-word; text-align:center; }

  .pillrow{ display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:6px; }
  .pill{
    text-align:center; padding:9px 4px; border-radius:9px; border:1px solid var(--border);
    background:var(--panel2); color:var(--text-muted); font-size:12px; cursor:pointer;
  }
  .pill.active{ border-color:var(--accent); color:var(--accent); font-weight:600; }
  .pill.active.pos{ border-color:var(--positive); color:var(--positive); }
  .pill.active.neutral{ border-color:var(--text); color:var(--text); }

  .daylist{ display:flex; flex-direction:column; gap:8px; }
  .dayitem{
    display:flex; align-items:center; justify-content:space-between; background:var(--panel2);
    border:1px solid var(--border); border-radius:10px; padding:10px 12px; cursor:pointer;
  }
  .dayitem.today{ border-color:var(--accent); }
  .dayitem .dname{ font-size:15px; }
  .dayitem .dname small{ display:block; color:var(--text-muted); font-size:13px; }
  .dayitem .dvals{ text-align:right; font-family:'JetBrains Mono', monospace; font-size:15px; }
  .dayitem .dvals .delta{ display:block; font-size:13px; margin-top:2px; }
  .dayitem .dvals .delta.pos{ color:var(--positive); }
  .dayitem .dvals .delta.warn{ color:var(--accent); }
  .badge{ font-size:14px; font-weight:600; }
  .badge.urlaub{ color:var(--accent); }
  .badge.ueberstd{ color:var(--positive); }
  .badge.feiertag{ color:var(--text); }

  .dicon{ font-size:16px; margin-right:7px; display:inline-block; width:18px; text-align:center; }
  .dicon.ico-urlaub{ color:var(--accent); }
  .dicon.ico-feiertag{ color:var(--text); }
  .dicon.ico-ueberstd{ color:var(--positive); }
  .dicon.ico-warn{ color:#E8B23D; }
  .dicon.ico-arbeit{ color:var(--text-muted); }

  .segrow{
    display:flex; align-items:center; gap:8px; background:var(--panel2); border:1px solid var(--border);
    border-radius:10px; padding:8px 10px; margin-bottom:8px; cursor:pointer; transition:border-color .15s, background .15s;
  }
  .segrow[data-type]:active{ background:var(--panel); border-color:var(--accent-dim); }
  .segrow .tag{ font-size:10px; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-muted); width:44px; flex-shrink:0; }
  .segrow .times{ font-family:'JetBrains Mono', monospace; font-size:14px; }
  .segrow .dur{ margin-left:auto; font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--text-muted); }
  .segrow .del{ background:none; border:none; color:var(--accent); font-size:16px; padding:2px 4px; cursor:pointer; }
  .ghostbtn{
    width:100%; padding:11px; border-radius:10px; border:1px dashed var(--border); background:transparent;
    color:var(--text-muted); font-size:13px; cursor:pointer; margin-top:2px;
  }
  label.field{ display:block; font-size:12px; color:var(--text-muted); margin:14px 0 6px; }
  input[type=number], input[type=text]{
    width:100%; background:var(--panel2); border:1px solid var(--border); color:var(--text);
    border-radius:10px; padding:11px 12px; font-family:'JetBrains Mono', monospace; font-size:15px;
  }
  input[type=time]{
    background:transparent; border:none; color:var(--text); font-family:'JetBrains Mono', monospace; font-size:14px;
  }
  select.jobsel{
    width:100%; background:var(--panel2); border:1px solid var(--border); color:var(--text);
    border-radius:10px; padding:11px 12px; font-family:'Inter', sans-serif; font-size:14px;
  }
  .wdays{ display:flex; gap:6px; margin-top:6px; }
  .wdays label{
    flex:1; text-align:center; background:var(--panel2); border:1px solid var(--border); border-radius:8px;
    padding:8px 0; font-size:12px; color:var(--text-muted); cursor:pointer;
  }
  .wdays input{ display:none; }
  .wdays label.active{ border-color:var(--accent); color:var(--accent); font-weight:600; }
  .btnrow{ display:flex; gap:10px; margin-top:14px; }
  .btn{ flex:1; padding:12px; border-radius:10px; border:1px solid var(--border); background:var(--panel2); color:var(--text); font-size:14px; cursor:pointer; text-align:center; }
  .btn.primary{ background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }
  .btn.danger{ color:var(--accent); border-color:var(--accent); }
  .korrekturitem{
    display:flex; align-items:center; justify-content:space-between; background:var(--panel2);
    border:1px solid var(--border); border-radius:10px; padding:9px 12px; margin-bottom:8px; font-size:13px;
  }
  .korrekturitem .kval.pos{ color:var(--positive); font-family:'JetBrains Mono', monospace; }
  .korrekturitem .kval.neg{ color:var(--accent); font-family:'JetBrains Mono', monospace; }

  nav.bottom{
    position:fixed; bottom:0; left:0; right:0; max-width:520px; margin:0 auto;
    background:var(--panel); border-top:1px solid var(--border); display:flex; padding-bottom:env(safe-area-inset-bottom);
    box-shadow:0 -4px 14px rgba(0,0,0,0.4);
  }
  nav.bottom button{
    flex:1; background:none; border:none; color:var(--text-muted); padding:10px 0 8px;
    font-family:'Inter', sans-serif; font-size:11px; display:flex; flex-direction:column;
    align-items:center; gap:4px; cursor:pointer; position:relative;
  }
  nav.bottom button .ic{ font-size:18px; }
  nav.bottom button.active{ color:var(--accent); }
  nav.bottom button.active::before{
    content:""; position:absolute; top:0; left:22%; right:22%; height:2px; background:var(--accent);
  }

  .overlay{ position:fixed; inset:0; background:rgba(6,5,5,0.75); display:flex; align-items:flex-end; justify-content:center; z-index:50; }
  .overlay.centered{ align-items:center; }
  .sheet{
    background:var(--bg); border:1px solid var(--border); border-bottom:none; border-radius:18px 18px 0 0;
    width:100%; max-width:520px; max-height:88vh; overflow-y:auto; padding:18px 16px calc(20px + env(safe-area-inset-bottom));
  }
  .sheet.roomy{
    min-height:64vh; max-height:80vh; border-bottom:1px solid var(--border); border-radius:18px;
    display:flex; flex-direction:column; margin:0 12px;
  }
  .sheet h2{ font-family:'Big Shoulders Display', sans-serif; font-size:20px; text-transform:uppercase; margin:0 0 12px; }
  .sheet p{ font-size:14px; color:var(--text-muted); line-height:1.5; }
  .closebtn{ position:sticky; top:0; float:right; background:var(--panel2); border:1px solid var(--border); color:var(--text); width:30px;height:30px;border-radius:8px;font-size:15px; }
  .empty{ color:var(--text-muted); font-size:13px; text-align:center; padding:18px 0; }
  .minutes-center{ flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; width:100%; }
  .minutes-center label.field{ text-align:center; width:100%; }
  .minutes-center input[type=time]{
    font-size:28px; font-weight:600; padding:12px 10px; background:var(--panel2);
    border:1.5px solid var(--accent-dim); border-radius:14px; margin-bottom:14px; width:220px;
    max-width:90%; text-align:center;
  }
  .minutestepper{ display:flex; align-items:center; justify-content:center; gap:18px; margin:14px 0; }
  .minutestepper input{
    width:130px; text-align:center; font-size:54px; font-weight:700; font-family:'JetBrains Mono', monospace;
    background:var(--panel2); border:1.5px solid var(--accent-dim); border-radius:16px; padding:14px 6px; color:var(--accent);
  }
  .stepbtn{
    width:56px; height:56px; border-radius:50%; background:var(--panel2); border:1.5px solid var(--accent-dim);
    color:var(--text); font-size:28px; font-weight:700; cursor:pointer; box-shadow:0 3px 8px rgba(0,0,0,0.4);
  }
</style>
</head>

  var STORAGE_KEY = "zeiterfassung_data_v1";

  function loadState(){

      parsed.settings = Object.assign({}, defaultState.settings, parsed.settings||{});
      if(!parsed.settings.jobs) parsed.settings.jobs = [];
      if(typeof parsed.aktiverJob === "undefined") parsed.aktiverJob = null;
      parsed.tage = parsed.tage || {};

      parsed.ui = Object.assign({}, defaultState.ui, parsed.ui||{});

      Object.keys(parsed.tage).forEach(function(ds){
        var t = parsed.tage[ds];
        if(t && typeof t.urlaub !== "undefined" && !t.abwesenheit){
          t.abwesenheit = t.urlaub ? "urlaub" : null;
          delete t.urlaub;
        }
        if(t && !t.pausen) t.pausen = [];
        if(t && typeof t.marker === "undefined") t.marker = "";

  /* ---------- Date helpers ---------- */
  function pad(n){ return n<10 ? "0"+n : ""+n; }

  function strToDate(s){ var p = s.split("-"); return new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2])); }
  function isoWeekday(d){ return ((d.getDay()+6)%7)+1; }
  function addDays(d, n){ var r = new Date(d); r.setDate(r.getDate()+n); return r; }
  var WD_NAMES = ["Mo","Di","Mi","Do","Fr","Sa","So"];
  var MONTH_NAMES = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];

  function getMonday(d){ var wd = isoWeekday(d); return addDays(d, -(wd-1)); }

  }

    target.setMonth(0,1);
    if(target.getDay()!==4){ target.setMonth(0, 1 + ((4 - target.getDay())+7)%7); }
    return 1 + Math.round((firstThursday - target.getTime())/(7*86400000));
  }

  function getTag(dateStr){ return state.tage[dateStr] || null; }

    return state.tage[dateStr];
  }
  function pausenStundenTag(dateStr){

    return sum;
  }
  // Ist-Stunden eines Tages, inkl. laufender (noch nicht per "Gehen" abgeschlossener) Schicht/Pause,
  // damit "Ist" während der Arbeit korrekt live mitzählt statt bis zum Feierabend bei 0 (oder negativ durch
  // eine schon abgeschlossene Pause) zu verharren
  function istStundenTag(dateStr){
    var t = getTag(dateStr);
    if(t && t.abwesenheit) return 0;
    var sum = 0;
    if(t){
      (t.segmente||[]).forEach(function(s){ sum += (s.endTs - s.startTs)/3600000; });
      sum -= pausenStundenTag(dateStr);
      sum += (t.manuellStunden||0);
    }
    if(state.laufend && state.laufend.datum === dateStr){
      sum += (Date.now() - state.laufend.startTs) / 3600000;
    }

  function gaugeArcD(f1, f2){
    var p1 = gaugePoint(f1), p2 = gaugePoint(f2);
    return 'M ' + p1.x.toFixed(2) + ' ' + p1.y.toFixed(2) + ' A ' + GAUGE_R + ' ' + GAUGE_R + ' 0 0 1 ' + p2.x.toFixed(2) + ' ' + p2.y.toFixed(2);
  }
  function gaugeTickD(frac, inset, outset){
    var angle = (180 - frac*180) * Math.PI/180;
    var r1 = GAUGE_R - inset, r2 = GAUGE_R + outset;
    var p1 = { x: GAUGE_CX + r1*Math.cos(angle), y: GAUGE_CY - r1*Math.sin(angle) };
    var p2 = { x: GAUGE_CX + r2*Math.cos(angle), y: GAUGE_CY - r2*Math.sin(angle) };
    return 'M ' + p1.x.toFixed(2) + ' ' + p1.y.toFixed(2) + ' L ' + p2.x.toFixed(2) + ' ' + p2.y.toFixed(2);
  }
  // Beschriftung an einer Bogenposition frac, etwas außerhalb des Bogens platziert
  function gaugeLabelSvg(frac, extraR, text, cls){
    var angle = (180 - frac*180) * Math.PI/180;
    var r = GAUGE_R + extraR;
    var x = GAUGE_CX + r*Math.cos(angle), y = GAUGE_CY - r*Math.sin(angle);
    var anchor = frac < 0.15 ? 'start' : (frac > 0.85 ? 'end' : 'middle');
    return '<text class="' + cls + '" x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" text-anchor="' + anchor + '">' + text + '</text>';
  }
  // Tacho-Nadel: liefert {body, tip} Polygon-Punkte für eine Bogenposition frac
  function gaugeNeedlePoints(frac){
    var deg = (frac-0.5)*180, rad = deg*Math.PI/180;
    var dx = Math.sin(rad), dy = -Math.cos(rad);
    var px = Math.cos(rad), py = Math.sin(rad);
    var len = GAUGE_R-14, baseFwd=8, w=4, tail=13, tw=3, tipLen=21;
    var tipX = GAUGE_CX+dx*len, tipY = GAUGE_CY+dy*len;
    var midX = GAUGE_CX+dx*(len-tipLen), midY = GAUGE_CY+dy*(len-tipLen);
    var baseX = GAUGE_CX+dx*baseFwd, baseY = GAUGE_CY+dy*baseFwd;
    var tailX = GAUGE_CX-dx*tail, tailY = GAUGE_CY-dy*tail;
    var bl={x:baseX+px*w,y:baseY+py*w}, br={x:baseX-px*w,y:baseY-py*w};
    var ml={x:midX+px*(w*0.45),y:midY+py*(w*0.45)}, mr={x:midX-px*(w*0.45),y:midY-py*(w*0.45)};
    var tl={x:tailX+px*tw,y:tailY+py*tw}, tr={x:tailX-px*tw,y:tailY-py*tw};
    function P(p){ return p.x.toFixed(2)+','+p.y.toFixed(2); }
    return {
      body: [P(ml),P(bl),P(tl),P(tr),P(br),P(mr)].join(' '),
      tip: [P({x:tipX,y:tipY}),P(ml),P(mr)].join(' ')
    };
  }
  function setGaugeNeedle(bodyEl, tipEl, frac){
    var pts = gaugeNeedlePoints(frac);
    if(bodyEl) bodyEl.setAttribute('points', pts.body);
    if(tipEl) tipEl.setAttribute('points', pts.tip);
  }

  // durchschnittliche Tagesarbeitszeit (Sollstunden/Woche ÷ Arbeitstage), unabhängig vom Wochentag
  function sollProTagAvg(){
    return state.settings.sollWoche / (state.settings.workdays.length || 1);
  }
  // Über-/Fehlstunden-Saldo der Woche, die den angegebenen Tag enthält (Ist minus Soll über Mo–So)
  function wochenSaldo(dateStr){
    var saldo = 0;
    getWeekDates(dateStr).forEach(function(ds){ saldo += istStundenTag(ds) - sollStundenTag(ds); });
    return saldo;
  }
  // Echter Überstunden-/Fehlstunden-Saldo NUR der bereits abgeschlossenen Tage dieser Woche (Montag bis
  // einschließlich dateStr) – zukünftige Tage zählen NICHT mit (anders als wochenSaldo), und der
  // heutige Tag zählt erst mit, wenn er wirklich abgeschlossen ist (nicht während man noch eingestempelt ist)
  function ueberstundenanteilWoche(dateStr){
    var saldo = 0;
    var heuteOffen = !!(state.laufend || state.laufendPause);
    getWeekDates(dateStr).forEach(function(ds){
      if(ds > dateStr) return;
      if(ds === dateStr && heuteOffen) return;
      saldo += istStundenTag(ds) - sollStundenTag(ds);
    });
    return saldo;
  }
  // Mini-Kachel für die Feierabend-Karte: "Ü <label>" bei Plus, "Noch <label>" bei Minus, Wert in Std./Min.
  function ueMiniHtml(saldo, posLabel, negLabel){
    var isUeber = saldo >= 0;
    var cls = isUeber ? "pos" : "warn";
    var k = isUeber ? posLabel : negLabel;
    return '<div class="fa-mini"><span class="fa-mini-v ' + cls + '">' + fmtHM(saldo) + '</span><span class="fa-mini-k">' + k + '</span></div>';
  }

  /* ---------- Rendering ---------- */
  var mainEl = document.getElementById("main");
  var overlayRoot = document.getElementById("overlayRoot");

  var pauseTickInterval = null;
  function render(){
    document.querySelectorAll("nav.bottom button").forEach(function(b){
      b.classList.toggle("active", b.dataset.tab === state.ui.tab);
    });
    document.getElementById("verLabel").textContent = "v" + APP_VERSION;
    if(pauseTickInterval){ clearInterval(pauseTickInterval); pauseTickInterval = null; }
    if(state.ui.tab === "heute") renderHeute();
    else if(state.ui.tab === "woche") renderWoche();
    else if(state.ui.tab === "monat") renderMonat();
    else if(state.ui.tab === "jahr") renderJahr();
    else if(state.ui.tab === "einstellungen") renderEinstellungen();
    if(state.ui.tab === "heute" && state.laufendPause){
      updatePauseDigits();
      pauseTickInterval = setInterval(updatePauseDigits, 1000);
    }
  }
  function updatePauseDigits(){
    var el = document.getElementById("gaugePauseTime");
    if(!el || !state.laufendPause) return;
    var vorherigeMs = pausenStundenTag(state.laufendPause.datum) * 3600000;
    var diff = vorherigeMs + (Date.now() - state.laufendPause.startTs);
    var s = Math.floor(diff/1000);
    var hh = Math.floor(s/3600), mm = pad(Math.floor((s%3600)/60)), ss = pad(s%60);
    el.textContent = (hh>0 ? hh+":" : "") + mm + ":" + ss;
  }

  /* ----- Heute ----- */
  var pendingIgnitionSweep = false;
  function renderHeute(){
    var ds = todayStr();
    var t = getTag(ds);
    var abwesenheit = t ? t.abwesenheit : null;
    var ist = istStundenTag(ds);
    var soll = sollStundenTag(ds);
    var ueber = ist - soll;

    var sollProTag = sollProTagAvg();

    var startsArr = [];
    (t ? t.segmente||[] : []).forEach(function(s){ startsArr.push(s.startTs); });
    if(state.laufend) startsArr.push(state.laufend.startTs);
    var startTs = startsArr.length ? Math.min.apply(null, startsArr) : null;
    var tagAbgeschlossen = !state.laufend && t && t.segmente && t.segmente.length > 0;
    var stopTs = null;
    if(tagAbgeschlossen){
      var endsArr = t.segmente.map(function(s){ return s.endTs; });
      stopTs = Math.max.apply(null, endsArr);
    } else if(startTs){
      // Hochrechnung: Start + Tagessoll + bisherige Pausen (live, inkl. laufender Pause) –
      // aktualisiert sich bei jedem Rendern (App öffnen, Pause stempeln etc.)
      var pausenMsBisher = pausenStundenTag(ds) * 3600000;
      if(state.laufendPause){
        pausenMsBisher += (Date.now() - state.laufendPause.startTs);
      }
      stopTs = startTs + sollProTag * 3600000 + pausenMsBisher;
    }

    var boostHours = Math.max(0, ist - sollProTag);
    var maxScale = sollProTag > 0 ? sollProTag * 1.5 : 1;
    var sollFrac = sollProTag > 0 ? sollProTag / maxScale : 0.6667;
    var fillFrac = maxScale > 0 ? Math.min(ist, sollProTag) / maxScale : 0;
    var boostEndFrac = maxScale > 0 ? Math.min(ist, maxScale) / maxScale : 0;

    var svg = '<svg class="gauge-svg" viewBox="0 0 220 130">';
    svg += '<path class="gauge-track-arc" d="' + gaugeArcD(0,1) + '"/>';
    // kleine Skalenstriche außerhalb des Bogens, wie bei einem Tacho
    var minorTicks = "";
    var TICK_COUNT = 16;
    for(var ti=1; ti<TICK_COUNT; ti++){
      var tf = ti/TICK_COUNT;
      if(Math.abs(tf - sollFrac) < 0.02) continue;
      minorTicks += '<path class="gauge-minor-tick" d="' + gaugeTickD(tf, -9, 15) + '"/>';
    }
    svg += minorTicks;
    svg += '<path class="gauge-fill-arc" d="' + (fillFrac > 0.002 ? gaugeArcD(0, fillFrac) : '') + '"/>';
    svg += '<path class="gauge-boost-arc" d="' + (boostEndFrac > sollFrac + 0.002 ? gaugeArcD(sollFrac, boostEndFrac) : '') + '"/>';
    svg += '<path class="gauge-tick" d="' + gaugeTickD(sollFrac, 11, 17) + '"/>';
    var needlePts = gaugeNeedlePoints(boostEndFrac);
    svg += '<polygon class="gauge-needle" id="gaugeNeedle" points="' + needlePts.body + '"/>';
    svg += '<polygon class="gauge-needle-tip" id="gaugeNeedleTip" points="' + needlePts.tip + '"/>';
    svg += '<circle class="gauge-hub-outer" cx="' + GAUGE_CX + '" cy="' + GAUGE_CY + '" r="9"/>';
    svg += '<circle class="gauge-hub-inner" cx="' + GAUGE_CX + '" cy="' + GAUGE_CY + '" r="3.7"/>';
    // Beschriftung: "0" links, Soll-Wert genau am Strich
    svg += '<text class="gauge-label" x="' + (GAUGE_CX-GAUGE_R-4) + '" y="' + (GAUGE_CY+16) + '" text-anchor="start">0</text>';
    svg += gaugeLabelSvg(sollFrac, 20, fmtH(sollProTag), 'gauge-label gauge-label-soll');
    svg += '</svg>';

    var centerHtml = "";
    if(state.laufendPause){
      var vorherigeMs = pausenStundenTag(state.laufendPause.datum) * 3600000;
      var totalMs = vorherigeMs + (Date.now() - state.laufendPause.startTs);
      var totalS = Math.floor(totalMs/1000);
      var hh0 = Math.floor(totalS/3600), mm0 = pad(Math.floor((totalS%3600)/60)), ss0 = pad(totalS%60);
      var pauseDisplay = (hh0>0 ? hh0+":" : "") + mm0 + ":" + ss0;
      centerHtml = '<div class="gc-lbl">⏸ Pause</div><div class="gc-val" id="gaugePauseTime">' + pauseDisplay + '</div>';
    }

    var gaugeStatusHtml = "";
    if(!state.laufendPause && boostHours > 0){
      gaugeStatusHtml = '<span class="boost-tag">🚀 Boost +' + fmtHM(boostHours) + '</span>';
    }

    var html = "";
    var tageSeitBackup = Math.floor((Date.now() - (state.lastExportAt||0)) / 86400000);
    if(!state.lastExportAt || tageSeitBackup > 30){
      var backupText = state.lastExportAt ? ('Seit ' + tageSeitBackup + ' Tagen kein Backup') : 'Noch nie ein Backup gemacht';
      html += '<div class="backup-hint" id="backupHint">⚠ ' + backupText + ' – jetzt exportieren</div>';
    }
    html += '<div class="card"><div class="clockwrap">';
    html += '<button class="jobselect" id="jobSelectBtn"><span class="jdot"></span>' + (state.aktiverJob ? escapeHtml(state.aktiverJob) : "Kein Job gewählt") + '</button>';
    html += '<div class="gauge"><div class="gauge-bglogo"></div><div class="gauge-row">';
    html += '<div class="gauge-side"><div class="gs-lbl">Start</div><div class="gs-time">' + (startTs ? fmtTime(startTs) : "--:--") + '</div></div>';
    html += '<div class="gauge-mid">' + svg + '<div class="gauge-center">' + centerHtml + '</div></div>';
    html += '<div class="gauge-side"><div class="gs-lbl">Ende</div><div class="gs-time">' + (stopTs ? fmtTime(stopTs) : "--:--") + '</div></div>';
    html += '</div><div class="gauge-status">' + gaugeStatusHtml + '</div></div>';
    html += '<div class="punchrow" id="punchRow"></div>';
    var laufendAktiv = !!(state.laufend || state.laufendPause);
    if(laufendAktiv){
      html += '<button class="ghostbtn" id="fixStartBtn" style="margin-top:10px;">Startzeit korrigieren</button>';
    }
    html += '</div></div>';

    html += '<div class="card"><h2 style="margin-bottom:8px;">Heute</h2>';
    html += '<div class="pillrow">';
    html += '<div class="pill ' + (!abwesenheit?'active':'') + '" data-abw="">Keine</div>';
    html += '<div class="pill ' + (abwesenheit==='urlaub'?'active':'') + '" data-abw="urlaub">Urlaub</div>';
    html += '<div class="pill ' + (abwesenheit==='feiertag'?'active neutral':'') + '" data-abw="feiertag">Feiertag</div>';
    html += '<div class="pill ' + (abwesenheit==='ueberstunden'?'active pos':'') + '" data-abw="ueberstunden">Ü-Tag genommen</div>';
    html += '</div>';
    if(!abwesenheit){
      html += '<div class="bigstat" style="margin-top:12px; justify-content:center;"><div style="text-align:center;">';
      html += '<div class="num ' + (ueber>=0?'pos':'warn') + '">' + (ueber>=0?'+':'') + fmtH(ueber) + '</div><div class="lbl">Über/Fehl heute</div>';
      html += '</div></div>';
      var wochenUeber = wochenSaldo(ds);
      var ueAnteil = ueberstundenanteilWoche(ds);
      html += '<div class="feierabend" style="margin-top:12px;"><div class="fa-extra">';
      html += ueMiniHtml(wochenUeber, "Überstunden Woche", "Stunden noch pro Woche");
      html += '<div class="fa-mini"><span class="fa-mini-v ' + (ueAnteil>=0?'pos':'warn') + '">' + (ueAnteil>=0?'+':'') + fmtH(ueAnteil) + '</span><span class="fa-mini-k">Überstundenanteil in der Woche</span></div>';
      html += '</div></div>';
    } else {
      var abwText = abwesenheit==='urlaub' ? "Urlaubstag – kein Soll heute." : abwesenheit==='feiertag' ? "Gesetzlicher Feiertag – kein Soll heute." : "Freier Tag durch Überstundenabbau.";
      html += '<div class="empty" style="padding-top:12px;">' + abwText + '</div>';
    }
    html += '</div>';

    if(!abwesenheit){
      html += '<div class="card"><h2>Zeiten &amp; Pausen heute</h2>';
      html += '<div id="segList"></div>';
      html += '<button class="ghostbtn" id="addManualSeg">+ Arbeitszeit manuell eintragen</button>';
      html += '<button class="ghostbtn" id="addManualPause">+ Pause manuell eintragen</button>';
      html += '<button class="ghostbtn" id="addManualHours">+ Zusätzliche Stunden (Korrektur)</button>';
      html += '<label class="field">Markierung</label>';
      html += '<button type="button" class="pill ' + ((t && t.marker===MARKER_ICON)?'active':'') + '" id="dayMarkerBtn" style="display:inline-block; width:auto; padding:9px 18px;">' + MARKER_ICON + ' Markiert</button>';
      html += '</div>';
    }

    mainEl.innerHTML = html;
    renderPunchRow(ds);
    if(!abwesenheit) renderSegList(ds, document.getElementById("segList"));

    document.querySelectorAll(".pill[data-abw]").forEach(function(p){
      p.addEventListener("click", function(){
        var val = p.dataset.abw || null;
        if(!val || abwesenheit === val){
          ensureTag(ds).abwesenheit = null;
          saveState(); render();
        } else {
          startAbwesenheit(ds, val, render);
        }
      });
    });
    var addSeg = document.getElementById("addManualSeg");
    if(addSeg) addSeg.addEventListener("click", function(){ openSegModal(ds, "arbeit"); });
    var addPause = document.getElementById("addManualPause");
    if(addPause) addPause.addEventListener("click", function(){ openSegModal(ds, "pause"); });
    var addHours = document.getElementById("addManualHours");
    if(addHours) addHours.addEventListener("click", function(){ openManualHoursModal(ds); });
    var fixBtn = document.getElementById("fixStartBtn");
    if(fixBtn) fixBtn.addEventListener("click", function(){ openFixStartModal(); });
    var jobBtn = document.getElementById("jobSelectBtn");
    if(jobBtn) jobBtn.addEventListener("click", openJobPicker);
    var markerBtn = document.getElementById("dayMarkerBtn");
    if(markerBtn) markerBtn.addEventListener("click", function(){
      var tg = ensureTag(ds);
      tg.marker = (tg.marker === MARKER_ICON) ? "" : MARKER_ICON;
      saveState(); render();
    });
    var backupHintEl = document.getElementById("backupHint");
    if(backupHintEl) backupHintEl.addEventListener("click", function(){
      state.ui.tab = "einstellungen"; saveState(); render();
    });
    if(pendingIgnitionSweep){
      pendingIgnitionSweep = false;
      playIgnitionSweep(ds);
    }
  }
  // Zündungs-Schwung beim Einstempeln: Tacho schwingt einmal bis zum Anschlag hoch und dann auf
  // den echten aktuellen Stand zurück, wie ein Auto-Tacho beim Start
  function playIgnitionSweep(ds){
    var fillEl = document.querySelector('.gauge-fill-arc');
    var boostEl = document.querySelector('.gauge-boost-arc');
    var needleEl = document.getElementById('gaugeNeedle');
    var needleTipEl = document.getElementById('gaugeNeedleTip');
    if(!fillEl) return;
    var sollProTag = sollProTagAvg();
    var maxScale = sollProTag > 0 ? sollProTag * 1.5 : 1;
    var sollFrac = sollProTag > 0 ? sollProTag / maxScale : 0.6667;
    var targetIst = istStundenTag(ds);
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function drawAt(hours){
      var fillFrac = Math.min(hours, sollProTag) / maxScale;
      var boostEndFrac = Math.min(hours, maxScale) / maxScale;
      fillEl.setAttribute('d', fillFrac > 0.002 ? gaugeArcD(0, fillFrac) : '');
      if(boostEl) boostEl.setAttribute('d', boostEndFrac > sollFrac+0.002 ? gaugeArcD(sollFrac, boostEndFrac) : '');
      setGaugeNeedle(needleEl, needleTipEl, boostEndFrac);
    }
    if(reduceMotion){ drawAt(targetIst); return; }
    function easeOutCubic(t){ return 1-Math.pow(1-t,3); }
    function easeOutBack(t){ var c1=1.70158,c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); }
    var sweepMs=650, settleMs=850, totalMs=sweepMs+settleMs, t0=Date.now();
    var iv=setInterval(function(){
      var elapsed=Date.now()-t0, h;
      if(elapsed<sweepMs){
        h = easeOutCubic(elapsed/sweepMs)*maxScale;
      } else if(elapsed<totalMs){
        var p=easeOutBack((elapsed-sweepMs)/settleMs);
        h = maxScale + (targetIst-maxScale)*p;
      } else {
        h = targetIst;
        clearInterval(iv);
      }
      drawAt(Math.max(0,h));
    }, 16);
  }

  function renderPunchRow(ds){
    var row = document.getElementById("punchRow");
    if(!row) return;
    var html = "";
    if(state.laufendPause){
      html = '<button class="punchbtn" id="btnPauseEnde">Pause Ende</button>';
    } else if(state.laufend){
      html = '<button class="punchbtn secondary" id="btnPauseStart">Pause</button>';
      html += '<button class="punchbtn" id="btnGehen">Gehen</button>';
    } else {
      html = '<button class="punchbtn" id="btnKommen">Kommen</button>';
    }
    row.innerHTML = html;
    var btnKommen = document.getElementById("btnKommen");
    if(btnKommen) btnKommen.addEventListener("click", function(){ punch(btnKommen, function(){ state.laufend = { datum: ds, startTs: Date.now(), job: state.aktiverJob }; pendingIgnitionSweep = true; }, "kommen"); });
    var btnPauseStart = document.getElementById("btnPauseStart");
    if(btnPauseStart) btnPauseStart.addEventListener("click", function(){ punch(btnPauseStart, function(){ state.laufendPause = { datum: ds, startTs: Date.now() }; }, "pauseStart"); });
    var btnPauseEnde = document.getElementById("btnPauseEnde");
    if(btnPauseEnde) btnPauseEnde.addEventListener("click", function(){ punch(btnPauseEnde, function(){
      if(!state.laufendPause) return;
      var tg = ensureTag(state.laufendPause.datum);
      tg.pausen.push({ startTs: state.laufendPause.startTs, endTs: Date.now() });
      state.laufendPause = null;
    }, "pauseEnde"); });
    var btnGehen = document.getElementById("btnGehen");
    if(btnGehen) btnGehen.addEventListener("click", function(){ punch(btnGehen, function(){
      if(!state.laufend) return;
      var tg = ensureTag(state.laufend.datum);
      tg.segmente.push({ startTs: state.laufend.startTs, endTs: Date.now(), job: state.laufend.job || null });
      state.laufend = null;
    }, "gehen"); });
  }
  /* ---------- Stempel-Töne ---------- */
  var audioCtx = null;
  function getAudioCtx(){
    if(!audioCtx){
      try{
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        getV8StartBuffer(audioCtx); // schon mal im Hintergrund dekodieren, bevor er gebraucht wird
      }catch(e){ return null; }
    }
    if(audioCtx.state === "suspended"){ audioCtx.resume(); }
    return audioCtx;
  }
  var v8StartBuffer = null, v8StartLoading = null;
  function getV8StartBuffer(ctx){
    if(v8StartBuffer) return Promise.resolve(v8StartBuffer);
    if(v8StartLoading) return v8StartLoading;
    try{
      var bin = atob(V8_START_SOUND_B64);
      var bytes = new Uint8Array(bin.length);
      for(var i=0;i<bin.length;i++){ bytes[i] = bin.charCodeAt(i); }
      v8StartLoading = ctx.decodeAudioData(bytes.buffer).then(function(buf){ v8StartBuffer = buf; return buf; });
    }catch(e){ v8StartLoading = Promise.reject(e); }
    return v8StartLoading;
  }
  // echte Aufnahme abspielen statt Synthese (für "Kommen": Anlasser + Anspringen + Hochdrehen)
  function playV8Start(ctx, gainVal){
    getV8StartBuffer(ctx).then(function(buf){
      var src = ctx.createBufferSource();
      src.buffer = buf;
      var gain = ctx.createGain();
      gain.gain.value = gainVal;
      src.connect(gain); gain.connect(ctx.destination);
      src.start();
    }).catch(function(){});
  }
  function noiseBuffer(ctx, duration){
    var size = Math.max(1, Math.floor(ctx.sampleRate * duration));
    var buffer = ctx.createBuffer(1, size, ctx.sampleRate);
    var data = buffer.getChannelData(0);
    for(var i=0;i<size;i++){ data[i] = Math.random()*2-1; }
    return buffer;
  }
  // Drei leicht verstimmte Sägezahn-Oszillatoren durch Tiefpass = Motor-Grundton;
  // per Amplitudenmodulation ("Chug"-LFO) wird daraus ein zündendes Mehrzylinder-Blubbern statt ein reiner Ton.
  // freqStart->freqEnd = Drehzahlverlauf, chugStart->chugEnd = wie schnell die "Zündungen" pulsieren.
  function engineLayer(ctx, t0, startAt, freqStart, freqEnd, rampTime, holdTime, releaseTime, gainPeak, chugStart, chugEnd, chugDepth){
    var t = t0 + startAt;
    var totalDur = rampTime + holdTime + releaseTime;
    var filter = ctx.createBiquadFilter();
    filter.type = "lowpass"; filter.frequency.value = 850; filter.Q.value = 0.7;
    var mainGain = ctx.createGain();
    var detunes = [0, -16, 12];
    var muls = [1, 0.996, 1.004];
    var oscs = [];
    for(var i=0;i<3;i++){
      var osc = ctx.createOscillator();
      osc.type = "sawtooth";
      osc.detune.value = detunes[i];
      osc.frequency.setValueAtTime(freqStart*muls[i], t);
      osc.frequency.linearRampToValueAtTime(freqEnd*muls[i], t + rampTime);
      osc.connect(filter);
      osc.start(t);
      oscs.push(osc);
    }
    filter.connect(mainGain); mainGain.connect(ctx.destination);
    mainGain.gain.setValueAtTime(0.0001, t);
    mainGain.gain.exponentialRampToValueAtTime(gainPeak, t + Math.max(0.04, rampTime*0.35));
    mainGain.gain.setValueAtTime(gainPeak, t + rampTime + holdTime);
    mainGain.gain.exponentialRampToValueAtTime(0.0001, t + totalDur);
    var lfo = ctx.createOscillator();
    lfo.type = "sine";
    lfo.frequency.setValueAtTime(chugStart, t);
    lfo.frequency.linearRampToValueAtTime(chugEnd, t + totalDur);
    var lfoGain = ctx.createGain();
    lfoGain.gain.value = gainPeak * (chugDepth || 0.35);
    lfo.connect(lfoGain); lfoGain.connect(mainGain.gain);
    lfo.start(t);
    var stopAt = t + totalDur + 0.08;
    oscs.forEach(function(o){ o.stop(stopAt); });
    lfo.stop(stopAt);
  }
  // Anlasser: choppiges, band-gefiltertes Rauschen (nagelndes "rrr-rrr-rrr" vorm Anspringen)
  function starterCrank(ctx, t0, startAt, duration, gainPeak){
    var t = t0 + startAt;
    var src = ctx.createBufferSource();
    src.buffer = noiseBuffer(ctx, duration);
    var filter = ctx.createBiquadFilter();
    filter.type = "bandpass"; filter.frequency.value = 340; filter.Q.value = 2.2;
    var gain = ctx.createGain();
    gain.gain.setValueAtTime(gainPeak*0.5, t);
    gain.gain.setValueAtTime(gainPeak*0.5, t + duration - 0.06);
    gain.gain.linearRampToValueAtTime(0.0001, t + duration);
    var lfo = ctx.createOscillator(); lfo.type = "square"; lfo.frequency.value = 8.5;
    var lfoGain = ctx.createGain(); lfoGain.gain.value = gainPeak*0.5;
    lfo.connect(lfoGain); lfoGain.connect(gain.gain);
    src.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
    var stopAt = t + duration + 0.03;
    src.start(t); src.stop(stopAt);
    lfo.start(t); lfo.stop(stopAt);
  }
  // Reifenquietschen: bandgefiltertes Rauschen mit Tonhöhen-Sweep + schnellem "Wobble" fürs Kreischen,
  // dazu ein tiefes Motor-Growl-Fundament für das Gewicht der Vollbremsung
  function tireScreech(ctx, t0, startAt, duration, freqStart, freqEnd, gainPeak){
    var t = t0 + startAt;
    var src = ctx.createBufferSource();
    src.buffer = noiseBuffer(ctx, duration);
    var filter = ctx.createBiquadFilter();
    filter.type = "bandpass";
    filter.frequency.setValueAtTime(freqStart, t);
    filter.frequency.linearRampToValueAtTime(freqEnd, t + duration);
    filter.Q.value = 12;
    var wobble = ctx.createOscillator(); wobble.type = "sine"; wobble.frequency.value = 7.5;
    var wobbleGain = ctx.createGain(); wobbleGain.gain.value = 230;
    wobble.connect(wobbleGain); wobbleGain.connect(filter.frequency);
    var gain = ctx.createGain();
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(gainPeak, t + 0.05);
    gain.gain.setValueAtTime(gainPeak, t + duration*0.75);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
    src.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
    var stopAt = t + duration + 0.05;
    src.start(t); src.stop(stopAt);
    wobble.start(t); wobble.stop(stopAt);
    engineLayer(ctx, t0, startAt, 130, 90, duration*0.3, duration*0.3, duration*0.4, gainPeak*0.45, 14, 9, 0.3);
  }
  function playPunchSound(kind){
    var ctx = getAudioCtx();
    if(!ctx) return;
    var t0 = ctx.currentTime;
    if(kind === "kommen"){
      // echte Aufnahme: Anlasser/Anspringen + Hochdrehen (~3s)
      playV8Start(ctx, 0.4);
    } else if(kind === "pauseStart"){
      // Vollbremsung: quietschende Reifen, ~0.9s
      tireScreech(ctx, t0, 0, 0.9, 2400, 1500, 0.18);
    } else if(kind === "pauseEnde"){
      // Gas geben: Drehzahl-Blip über ~0,65s
      engineLayer(ctx, t0, 0, 100, 260, 0.28, 0.05, 0.35, 0.20, 12, 24, 0.4);
    } else if(kind === "gehen"){
      // Motor geht aus: Drehzahl und Zündfolge werden über ~1,4s langsamer, dann ein letztes Klacken
      engineLayer(ctx, t0, 0, 105, 35, 0.9, 0.0, 0.5, 0.17, 13, 4, 0.5);
      engineLayer(ctx, t0, 1.32, 45, 42, 0.02, 0.02, 0.13, 0.18, 4, 4, 0.2);
    }
  }
  function punch(btn, mutate, sound){
    if(btn.disabled) return;
    btn.disabled = true;
    btn.classList.add("pressed");
    if(sound) playPunchSound(sound);
    setTimeout(function(){ mutate(); saveState(); render(); }, 130);
  }

  function renderSegList(dateStr, container, onDone){
    onDone = onDone || render;
    var t = getTag(dateStr);
    var segs = (t && t.segmente) || [];
    var pausen = (t && t.pausen) || [];
    if(segs.length===0 && pausen.length===0 && !(t && t.manuellStunden)){
      container.innerHTML = '<div class="empty">Noch keine Zeit erfasst.</div>';
      return;
    }
    var html = "";
    segs.forEach(function(s, idx){
      var dur = (s.endTs - s.startTs)/3600000;
      html += '<div class="segrow" data-type="seg" data-idx="' + idx + '"><span class="tag">Arbeit</span>';
      html += '<span class="times">' + fmtTime(s.startTs) + ' – ' + fmtTime(s.endTs) + (s.job ? ' <span style="color:var(--accent);">· '+escapeHtml(s.job)+'</span>' : '') + '</span>';
      html += '<span class="dur">' + fmtH(dur) + '</span>';
      html += '<button class="del" data-type="seg" data-idx="' + idx + '">✕</button></div>';
    });
    if(pausen.length){
      var pauseMin = Math.round(pausenStundenTag(dateStr) * 60);
      html += '<div class="segrow" id="pauseSummaryRow"><span class="tag">Pause</span>';
      html += '<span class="times">' + pauseMin + ' Min.</span>';
      html += '<span class="dur">' + pausen.length + 'x</span></div>';
    }
    if(t && t.manuellStunden){
      html += '<div class="segrow"><span class="tag">Extra</span><span class="times">Korrektur</span><span class="dur">' + fmtH(t.manuellStunden) + '</span><button class="del" data-type="manual">✕</button></div>';
    }
    container.innerHTML = html;
    container.querySelectorAll(".del").forEach(function(btn){
      btn.addEventListener("click", function(e){
        e.stopPropagation();
        var tg = ensureTag(dateStr);
        if(btn.dataset.type==="seg") tg.segmente.splice(parseInt(btn.dataset.idx),1);
        else if(btn.dataset.type==="pause") tg.pausen.splice(parseInt(btn.dataset.idx),1);
        else tg.manuellStunden = 0;
        saveState(); onDone();
      });
    });
    var pauseSummary = container.querySelector("#pauseSummaryRow");
    if(pauseSummary) pauseSummary.addEventListener("click", function(){ openPausenListModal(dateStr, onDone); });
    container.querySelectorAll(".segrow[data-type]").forEach(function(row){
      row.addEventListener("click", function(){
        openEditSegModal(dateStr, row.dataset.type, parseInt(row.dataset.idx), onDone);
      });
    });
  }

  // Bearbeitet ein bereits erfasstes Arbeits- oder Pausensegment (antippen in der Liste)
  // Baut Von/Bis- oder Minuten-Felder für eine Pause, mit Umschalter
  // Große, zentrierte Von/Bis-Felder für Arbeitszeit (gleiche Optik wie bei der Pause)
  function arbeitFieldsHtml(existingSD, existingED){
    var html = '<div class="minutes-center">';
    html += '<label class="field">Von</label><input type="time" id="segStart" value="' + (existingSD ? pad(existingSD.getHours())+':'+pad(existingSD.getMinutes()) : "08:00") + '">';
    html += '<label class="field">Bis</label><input type="time" id="segEnd" value="' + (existingED ? pad(existingED.getHours())+':'+pad(existingED.getMinutes()) : "17:00") + '">';
    html += '</div>';
    return html;
  }
  function pauseFieldsHtml(existingSD, existingED){
    var minutesVal = (existingSD && existingED) ? Math.round((existingED - existingSD)/60000) : 15;
    var html = '';
    html += '<div class="pillrow" id="pauseModeToggle" style="margin-top:6px;">';
    html += '<div class="pill active" data-mode="zeit">Uhrzeit</div>';
    html += '<div class="pill" data-mode="min">Minuten</div>';
    html += '</div>';
    html += '<div id="pauseFieldsZeit" class="minutes-center">';
    html += '<label class="field">Von</label><input type="time" id="segStart" value="' + (existingSD ? pad(existingSD.getHours())+':'+pad(existingSD.getMinutes()) : "12:00") + '">';
    html += '<label class="field">Bis</label><input type="time" id="segEnd" value="' + (existingED ? pad(existingED.getHours())+':'+pad(existingED.getMinutes()) : "12:15") + '">';
    html += '</div>';
    html += '<div id="pauseFieldsMin" style="display:none;" class="minutes-center">';
    html += '<label class="field" style="text-align:center;">Dauer in Minuten</label>';
    html += '<div class="minutestepper">';
    html += '<button type="button" class="stepbtn" id="minMinus">–</button>';
    html += '<input type="number" step="1" min="1" id="segMinutes" value="' + minutesVal + '" inputmode="numeric">';
    html += '<button type="button" class="stepbtn" id="minPlus">+</button>';
    html += '</div>';
    html += '</div>';
    return html;
  }
  function bindPauseModeToggle(container){
    container.querySelectorAll('#pauseModeToggle .pill').forEach(function(p){
      p.addEventListener('click', function(){
        container.querySelectorAll('#pauseModeToggle .pill').forEach(function(x){ x.classList.remove('active'); });
        p.classList.add('active');
        var mode = p.dataset.mode;
        container.querySelector('#pauseFieldsZeit').style.display = mode==='zeit' ? '' : 'none';
        container.querySelector('#pauseFieldsMin').style.display = mode==='min' ? '' : 'none';
      });
    });
    var minInput = container.querySelector('#segMinutes');
    var minusBtn = container.querySelector('#minMinus');
    var plusBtn = container.querySelector('#minPlus');
    if(minusBtn) minusBtn.addEventListener('click', function(){
      minInput.value = Math.max(1, (parseInt(minInput.value)||0) - 1);
    });
    if(plusBtn) plusBtn.addEventListener('click', function(){
      minInput.value = (parseInt(minInput.value)||0) + 1;
    });
  }
  // Liest die Pausen-Eingabe aus (egal ob Uhrzeit- oder Minuten-Modus gewählt wurde)
  function readPauseTimes(container, dateStr, existingStartTs){
    var activePill = container.querySelector('#pauseModeToggle .pill.active');
    var mode = activePill ? activePill.dataset.mode : 'zeit';
    var base = strToDate(dateStr);
    if(mode === 'min'){
      var mins = parseInt(container.querySelector('#segMinutes').value) || 0;
      if(mins <= 0) return null;
      var startD = existingStartTs ? new Date(existingStartTs) : new Date(base.getFullYear(), base.getMonth(), base.getDate(), 12, 0);
      var endD = new Date(startD.getTime() + mins*60000);
      return { startTs: startD.getTime(), endTs: endD.getTime() };
    }
    var sVal = container.querySelector('#segStart').value;
    var eVal = container.querySelector('#segEnd').value;
    if(!sVal || !eVal) return null;
    var sp = sVal.split(':'), ep = eVal.split(':');
    var ns = new Date(base.getFullYear(),base.getMonth(),base.getDate(),parseInt(sp[0]),parseInt(sp[1]));
    var ne = new Date(base.getFullYear(),base.getMonth(),base.getDate(),parseInt(ep[0]),parseInt(ep[1]));
    if(ne <= ns) ne = addDays(ne,1);
    return { startTs: ns.getTime(), endTs: ne.getTime() };
  }
  // prüft, ob [startTs,endTs) sich mit einem bereits gespeicherten Eintrag gleichen Typs am selben Tag überschneidet
  // (Pausen dürfen sich mit Arbeitszeiten überschneiden, das ist der Normalfall; geprüft wird nur gleicher Typ gegen gleichen Typ)
  function findUeberlappung(dateStr, isPause, startTs, endTs, skipIdx){
    var t = getTag(dateStr);
    if(!t) return false;
    var arr = isPause ? (t.pausen||[]) : (t.segmente||[]);
    for(var i=0;i<arr.length;i++){
      if(i === skipIdx) continue;
      var item = arr[i];
      if(startTs < item.endTs && endTs > item.startTs) return true;
    }
    return false;
  }
  function warnUeberlappung(){
    var closeHint = openSheet('<h2>Überschneidung</h2><p>Der Zeitraum überschneidet sich mit einem bereits erfassten Eintrag. Bitte Zeiten anpassen.</p><div class="btnrow"><button class="btn primary" id="okBtn" style="flex:1">Ok</button></div>');
    document.getElementById("okBtn").addEventListener("click", closeHint);
  }

  function openEditSegModal(dateStr, type, idx, onDone){
    onDone = onDone || render;
    var isPause = type === "pause";
    var t = ensureTag(dateStr);
    var arr = isPause ? t.pausen : t.segmente;
    var item = arr[idx];
    if(!item) return;
    var sD = new Date(item.startTs), eD = new Date(item.endTs);
    var html = '<h2>' + (isPause ? "Pause bearbeiten" : "Arbeitszeit bearbeiten") + '</h2>';
    if(isPause){
      html += pauseFieldsHtml(sD, eD);
    } else {
      html += arbeitFieldsHtml(sD, eD);
    }
    if(!isPause) html += jobSelectHtml("segJob", item.job);
    html += '<div class="btnrow"><button class="btn danger" id="segDelete">Löschen</button><button class="btn primary" id="segSave">Speichern</button></div>';
    html += '<button class="ghostbtn" id="segCancel" style="margin-top:10px;">Abbrechen</button>';
    var close = openSheet(html);
    var sheetEl = overlayRoot.lastElementChild;
    if(isPause) bindPauseModeToggle(sheetEl);
    sheetEl.classList.add("centered");
    sheetEl.querySelector(".sheet").classList.add("roomy");
    document.getElementById("segCancel").addEventListener("click", close);
    document.getElementById("segDelete").addEventListener("click", function(){
      arr.splice(idx,1); saveState(); close(); onDone();
    });
    document.getElementById("segSave").addEventListener("click", function(){
      var times;
      if(isPause){
        times = readPauseTimes(sheetEl, dateStr, item.startTs);
        if(!times) return;
      } else {
        var sVal = document.getElementById("segStart").value;
        var eVal = document.getElementById("segEnd").value;
        if(!sVal || !eVal) return;
        var base = strToDate(dateStr);
        var sp = sVal.split(":"), ep = eVal.split(":");
        var ns = new Date(base.getFullYear(),base.getMonth(),base.getDate(),parseInt(sp[0]),parseInt(sp[1]));
        var ne = new Date(base.getFullYear(),base.getMonth(),base.getDate(),parseInt(ep[0]),parseInt(ep[1]));
        if(ne <= ns) ne = addDays(ne,1);
        times = { startTs: ns.getTime(), endTs: ne.getTime() };
      }
      if(findUeberlappung(dateStr, isPause, times.startTs, times.endTs, idx)){ warnUeberlappung(); return; }
      item.startTs = times.startTs; item.endTs = times.endTs;
      if(!isPause){
        var jobEl = document.getElementById("segJob");
        item.job = jobEl ? (jobEl.value || null) : item.job;
      }
      saveState(); close(); onDone();
    });
  }

  // Zeigt die einzelnen Pausen eines Tages (aufgerufen durch Antippen der Pausen-Summenzeile)
  function openPausenListModal(dateStr, onDone){
    onDone = onDone || render;
    function content(){
      var t = getTag(dateStr);
      var pausen = (t && t.pausen) || [];
      var total = Math.round(pausenStundenTag(dateStr) * 60);
      var html = '<h2>Pausen heute – ' + total + ' Min. gesamt</h2>';
      if(pausen.length===0){ html += '<div class="empty">Keine Pausen erfasst.</div>'; }
      else {
        pausen.forEach(function(p, idx){
          var dur = Math.round((p.endTs - p.startTs)/60000);
          html += '<div class="segrow" data-idx="' + idx + '"><span class="tag">Pause</span>';
          html += '<span class="times">' + fmtTime(p.startTs) + ' – ' + fmtTime(p.endTs) + '</span>';
          html += '<span class="dur">' + dur + ' Min.</span>';
          html += '<button class="del" data-idx="' + idx + '">✕</button></div>';
        });
      }
      return html;
    }
    var sheet = openSheetDynamic(content());
    function bind(){
      sheet.body.querySelectorAll(".del").forEach(function(btn){
        btn.addEventListener("click", function(e){
          e.stopPropagation();
          ensureTag(dateStr).pausen.splice(parseInt(btn.dataset.idx),1);
          saveState(); sheet.setContent(content()); bind(); onDone();
        });
      });
      sheet.body.querySelectorAll(".segrow[data-idx]").forEach(function(row){
        row.addEventListener("click", function(){
          openEditSegModal(dateStr, "pause", parseInt(row.dataset.idx), function(){
            sheet.setContent(content()); bind(); onDone();
          });
        });
      });
    }
    bind();
  }

  function openSegModal(dateStr, type, onDone){
    onDone = onDone || render;
    var isPause = type === "pause";
    var html = '<h2>' + (isPause ? "Pause eintragen" : "Arbeitszeit eintragen") + '</h2>';
    if(isPause){
      html += pauseFieldsHtml(null, null);
    } else {
      html += arbeitFieldsHtml(null, null);
    }
    if(!isPause) html += jobSelectHtml("segJob", state.aktiverJob);
    html += '<div class="btnrow"><button class="btn" id="segCancel">Abbrechen</button><button class="btn primary" id="segSave">Speichern</button></div>';
    var close = openSheet(html);
    var sheetEl = overlayRoot.lastElementChild;
    if(isPause) bindPauseModeToggle(sheetEl);
    sheetEl.classList.add("centered");
    sheetEl.querySelector(".sheet").classList.add("roomy");
    document.getElementById("segCancel").addEventListener("click", close);
    document.getElementById("segSave").addEventListener("click", function(){
      var t = ensureTag(dateStr);
      if(isPause){
        var times = readPauseTimes(sheetEl, dateStr, null);
        if(!times) return;
        if(findUeberlappung(dateStr, true, times.startTs, times.endTs, -1)){ warnUeberlappung(); return; }
        t.pausen.push({ startTs: times.startTs, endTs: times.endTs });
      } else {
        var sVal = document.getElementById("segStart").value;
        var eVal = document.getElementById("segEnd").value;
        if(!sVal || !eVal) return;
        var base = strToDate(dateStr);
        var sp = sVal.split(":"), ep = eVal.split(":");
        var startD = new Date(base.getFullYear(),base.getMonth(),base.getDate(),parseInt(sp[0]),parseInt(sp[1]));
        var endD = new Date(base.getFullYear(),base.getMonth(),base.getDate(),parseInt(ep[0]),parseInt(ep[1]));
        if(endD <= startD) endD = addDays(endD,1);
        if(findUeberlappung(dateStr, false, startD.getTime(), endD.getTime(), -1)){ warnUeberlappung(); return; }
        var jobEl = document.getElementById("segJob");
        t.segmente.push({ startTs: startD.getTime(), endTs: endD.getTime(), job: jobEl ? (jobEl.value || null) : null });
      }
      saveState(); close(); onDone();
    });
  }

  // Job auswählen, hinzufügen oder entfernen (Button oben auf "Heute")
  function openJobPicker(){
    function content(){
      var jobs = state.settings.jobs;
      var html = '<h2>Job wählen</h2>';
      html += '<div class="daylist">';
      html += '<div class="dayitem" data-job=""><div class="dname">Kein Job</div>' + (!state.aktiverJob ? '<span class="badge ueberstd">✓ aktiv</span>' : '') + '</div>';
